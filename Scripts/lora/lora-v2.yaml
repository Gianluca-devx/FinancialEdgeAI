# LoRA adapter v2 (Specs/phase-2b-lora-wording.md, D26). Run from the repository root:
#   python3 Scripts/lora/prepare_data.py --source Dataset/v2 --out adapters/data-v2
#   mlx_lm.lora -c Scripts/lora/lora-v2.yaml        (and Scripts/lora/stop_rule.py --pid <pid> --log <log> beside it)
# The method and hyperparameters are those of lora-v1: only the data (Dataset/v2) and the length of the run change.
# The test splits are not in adapters/data-v2 and the tool's --test option is not used.
model: "mlx-community/Qwen3-4B-4bit"
train: true
data: "adapters/data-v2"
adapter_path: "adapters/lora-v2"
fine_tune_type: lora
mask_prompt: true          # the loss is on the answer, not on the prompt
num_layers: 16
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
batch_size: 4
iters: 600                 # at most 5 epochs of 480 examples; the stop rule may end the run earlier
learning_rate: 1.0e-4
val_batches: -1            # the whole validation set (48 examples, wording held out of the training data)
steps_per_report: 10
steps_per_eval: 50
save_every: 50
max_seq_length: 1024       # the longest example has 835 tokens
seed: 1
